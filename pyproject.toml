[project]
name = "med-sycophancy-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.11.0",
    "datasets>=5.2.0",
    "google-genai>=3.6.1",
    "inspect-ai>=0.3.291",
    "matplotlib>=3.11.2",
    "openai>=3.57.0",
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
med-sycophancy-eval = "med_sycophancy_eval:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
